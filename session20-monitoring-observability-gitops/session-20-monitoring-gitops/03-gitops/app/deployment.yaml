apiVersion: apps/v1
kind: Deployment
metadata:
  name: session20-gitops-app
  namespace: session20-gitops
  labels:
    app: session20-gitops-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: session20-gitops-app
  template:
    metadata:
      labels:
        app: session20-gitops-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
