# Alert rules. "for" is short here so the demo fires quickly. Production values are usually minutes.
groups:
  - name: application
    rules:
      - alert: AppDown
        expr: up{job="app"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "The demo app is down"
          description: "Prometheus cannot scrape the app target."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[1m]))
            / sum(rate(http_requests_total[1m])) > 0.2
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "More than 20% of requests are failing"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[1m]))) > 1
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "95th percentile latency is above 1 second"

  - name: host
    rules:
      - alert: HostHighCPU
        expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100 > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU usage is above 80%"

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage is above 85%"
