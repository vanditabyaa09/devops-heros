global:
  scrape_interval: 5s       # how often Prometheus pulls metrics (short, for the demo)
  evaluation_interval: 5s   # how often alert rules are checked

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: app
    static_configs:
      - targets: ["app:5000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
