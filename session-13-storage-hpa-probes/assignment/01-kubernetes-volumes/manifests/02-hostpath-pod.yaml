# hostPath: mounts a directory from the node's filesystem into the Pod.
# Data outlives the Pod, but is tied to that one node.
apiVersion: v1
kind: Pod
metadata:
  name: hostpath-demo
  namespace: session13
spec:
  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: host-storage
          mountPath: /data
  volumes:
    - name: host-storage
      hostPath:
        path: /tmp/hostpath-data
        type: DirectoryOrCreate
