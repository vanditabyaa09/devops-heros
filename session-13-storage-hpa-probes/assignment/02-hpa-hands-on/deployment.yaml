apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
  namespace: session13
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-demo
  template:
    metadata:
      labels:
        app: hpa-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m        # HPA computes utilization against this value
            limits:
              cpu: 200m
