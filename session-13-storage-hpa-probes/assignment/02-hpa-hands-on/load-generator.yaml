# Sends requests to hpa-demo-service in a tight loop to raise CPU usage.
# Scale it up for more load:  kubectl scale deploy load-generator -n session13 --replicas=3
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: session13
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://hpa-demo-service > /dev/null; done"]
